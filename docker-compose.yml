name: rag-playground

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-playground-db
    user: "999:999"
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      rag_db:
        ipv4_address: 172.30.251.2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-playground-api:local
    container_name: rag-playground-api
    restart: unless-stopped
    env_file:
      - path: .env.runtime
        required: true
    environment:
      ACTIVITY_CACHE_PATH: /activity/activity.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - model_cache:/models:ro
      - ./model-artifacts:/model-artifacts:ro
      - ${ACTIVITY_DATA_DIR:-./var/activity}:/activity:ro
    networks:
      rag_internal:
        ipv4_address: 172.18.0.3
      rag_db:
        ipv4_address: 172.30.251.3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=999
    mem_limit: 3500m
    cpus: 2.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    image: rag-playground-proxy:hardened
    container_name: rag-playground-proxy
    user: "10002:10002"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN}
      PUBLIC_IPV4: ${PUBLIC_IPV4}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      rag_internal:
        ipv4_address: 172.18.0.4
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    mem_limit: 96m
    cpus: 0.2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  rag_internal:
    name: rag-playground-internal
    ipam:
      config:
        - subnet: 172.18.0.0/16
  rag_db:
    name: rag-playground-db-private
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-rag-db
    ipam:
      config:
        - subnet: 172.30.251.0/29

volumes:
  pg_data:
    name: rag-playground-pg-data
  model_cache:
    name: rag-playground-model-cache
  caddy_data:
    name: rag-playground-caddy-data
  caddy_config:
    name: rag-playground-caddy-config
