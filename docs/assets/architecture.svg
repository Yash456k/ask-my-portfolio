<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How a question flows through Ask my portfolio</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b98a78"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8513d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="400" rx="22" fill="#fbf6f0"/>

  <!-- side lane: runs beside every request -->
  <rect x="455" y="24" width="280" height="62" rx="14" fill="#fffdfa" stroke="#d9c8ba" stroke-dasharray="5 5"/>
  <text x="595" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#2a2521">Jev reads every message</text>
  <text x="595" y="70" text-anchor="middle" font-size="12" fill="#857a72">intent · emotion · coverage, logged for grading</text>
  <path d="M595 150 L595 90" stroke="#b98a78" stroke-width="1.6" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>

  <!-- request path -->
  <rect x="30" y="150" width="180" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="120" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Portfolio site</text>
  <text x="120" y="207" text-anchor="middle" font-size="12" fill="#857a72">React on Vercel</text>

  <rect x="255" y="150" width="180" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="345" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Cloudflare Tunnel</text>
  <text x="345" y="207" text-anchor="middle" font-size="12" fill="#857a72">then Caddy, 4 public routes</text>

  <rect x="505" y="150" width="180" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="595" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">FastAPI</text>
  <text x="595" y="207" text-anchor="middle" font-size="12" fill="#857a72">limits, query, streaming</text>

  <rect x="740" y="112" width="220" height="70" rx="16" fill="#f6e4dc" stroke="#d99a88"/>
  <text x="850" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Jev (default)</text>
  <text x="850" y="162" text-anchor="middle" font-size="12" fill="#8a4a3a">reads every passage, picks one</text>

  <rect x="740" y="202" width="220" height="70" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="850" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">6 embedding models</text>
  <text x="850" y="252" text-anchor="middle" font-size="12" fill="#857a72">pgvector cosine search</text>

  <rect x="1015" y="150" width="195" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="1112" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">DeepSeek V4.1 Flash</text>
  <text x="1112" y="207" text-anchor="middle" font-size="12" fill="#857a72">Groq model as fallback</text>

  <g stroke="#b98a78" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M210 192 L251 192"/>
    <path d="M435 192 L501 192"/>
    <path d="M685 180 C 710 180, 712 147, 736 147"/>
    <path d="M685 204 C 710 204, 712 237, 736 237"/>
    <path d="M960 147 C 985 147, 988 180, 1011 180"/>
    <path d="M960 237 C 985 237, 988 204, 1011 204"/>
  </g>

  <!-- answer path -->
  <path d="M1112 234 L1112 318 Q1112 332 1098 332 L134 332 Q120 332 120 318 L120 238" stroke="#b8513d" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="318" width="360" height="28" rx="14" fill="#fbf6f0"/>
  <text x="620" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#b8513d">streamed answer · citations · sources · timings</text>
  <text x="620" y="376" text-anchor="middle" font-size="12" fill="#857a72">If no passage answers the question, the chat says so before any language model is called.</text>
</svg>
