<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How Ask my portfolio answers a question</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b98a78"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8513d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="412" rx="22" fill="#fbf6f0"/>

  <!-- side lane: runs beside every question -->
  <rect x="290" y="24" width="280" height="62" rx="14" fill="#fffdfa" stroke="#d9c8ba" stroke-dasharray="5 5"/>
  <text x="430" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#2a2521">Jev also reads the question</text>
  <text x="430" y="70" text-anchor="middle" font-size="12" fill="#857a72">intent · emotion · coverage, shown as tags</text>
  <path d="M125 160 L125 69 Q125 55 139 55 L286 55" stroke="#b98a78" stroke-width="1.6" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>

  <!-- question path -->
  <rect x="30" y="160" width="190" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="125" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Your question</text>
  <text x="125" y="219" text-anchor="middle" font-size="12" fill="#857a72">typed into the chat</text>

  <rect x="290" y="118" width="280" height="70" rx="16" fill="#f6e4dc" stroke="#d99a88"/>
  <text x="430" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Jev (default)</text>
  <text x="430" y="168" text-anchor="middle" font-size="12" fill="#8a4a3a">reads every passage as text, picks one</text>

  <rect x="290" y="216" width="280" height="70" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="430" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">or one of 6 embedding models</text>
  <text x="430" y="266" text-anchor="middle" font-size="12" fill="#857a72">finds the passages closest in meaning</text>

  <rect x="650" y="160" width="280" height="84" rx="16" fill="#fffdfa" stroke="#e3d5c8"/>
  <text x="790" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2521">Language model</text>
  <text x="790" y="219" text-anchor="middle" font-size="12" fill="#857a72">answers from those passages only</text>

  <g stroke="#b98a78" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M220 190 C 253 190, 253 153, 286 153"/>
    <path d="M220 214 C 253 214, 253 251, 286 251"/>
    <path d="M570 153 C 608 153, 608 190, 646 190"/>
    <path d="M570 251 C 608 251, 608 214, 646 214"/>
  </g>

  <!-- answer path -->
  <path d="M790 244 L790 326 Q790 340 776 340 L139 340 Q125 340 125 326 L125 248" stroke="#b8513d" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
  <rect x="277" y="326" width="360" height="28" rx="14" fill="#fbf6f0"/>
  <text x="457" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#b8513d">streamed answer · citations · sources · timings</text>
  <text x="480" y="390" text-anchor="middle" font-size="12" fill="#857a72">If no passage answers the question, the chat says so before any language model is called.</text>
</svg>
